[package]
name = "cinedesk"
version = "0.1.0"
description = "Logiciel tout-en-un pour réalisateurs et scénaristes"
edition = "2021"

[lib]
name = "cinedesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
